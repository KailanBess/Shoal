name: Baseline artifact and boot smoke

on:
  workflow_dispatch:
  push:
    branches: [build/baseline-iso]
    paths:
      - '.github/workflows/baseline-smoke.yml'
      - 'scripts/boot-smoke.py'
      - 'config/baseline-test-inputs.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: baseline-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Shoal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read pinned baseline run
        id: baseline
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const i=JSON.parse(fs.readFileSync("config/baseline-test-inputs.json","utf8")); if(!Number.isSafeInteger(i.runId)||i.runId<1)throw Error("Invalid run id"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${i.runId}\n`);'
      - name: Download baseline artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: shoal-cachyos-baseline-x86_64
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify downloaded ISO and build identity
        run: |
          set -euo pipefail
          (cd baseline && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json, pathlib
          actual=json.loads(pathlib.Path('baseline/BUILD-INFO.json').read_text())
          expected=json.loads(pathlib.Path('config/baseline-test-inputs.json').read_text())
          assert actual['shoalCommit']==expected['sourceCommit']
          assert actual['upstream']['commit']==expected['upstreamCommit']
          print(json.dumps(actual,indent=2))
          PY
      - name: Install disposable VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf xorriso
      - name: Run limited boot smoke checks
        run: python3 scripts/boot-smoke.py
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: baseline-boot-smoke-${{ github.run_attempt }}
          path: |
            reports/boot-smoke/*.log
            reports/boot-smoke/*.json
            reports/boot-smoke/*.cfg
          if-no-files-found: warn
          retention-days: 14
